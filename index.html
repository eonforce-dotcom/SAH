:root {
  --cream: #FBF8F3;
  --paper: #F4EFE6;
  --ink: #1A1612;
  --ink-soft: #5C534A;
  --ink-muted: #8B8278;
  --teal: #1F4F4A;
  --teal-dark: #163936;
  --coral: #C7484B;
  --coral-light: #F0DADB;
  --purple: #6B4A8B;
  --purple-light: #E8DEF0;
  --amber: #C7763B;
  --yellow: #D4A52A;
  --yellow-light: #F5EAC4;
  --green: #4A6B3F;
  --indigo: #3F4C6B;
  --indigo-light: #DDE3EE;
  --blue: #2F6F8F;
  --blue-light: #DCEBF2;
  --red: #B83E42;
  --red-light: #F2DADB;
  --line: #D9D2C5;
  --line-light: #ECE6D8;
  --shadow: 0 1px 3px rgba(26, 22, 18, 0.04), 0 4px 16px rgba(26, 22, 18, 0.04);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--cream); color: var(--ink); }
body {
  font-family: 'IBM Plex Sans', -apple-system, sans-serif;
  font-size: 15px;
  line-height: 1.5;
  min-height: 100vh;
  padding: 24px 16px;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3 {
  font-family: 'Fraunces', Georgia, serif;
  font-weight: 500;
  letter-spacing: -0.02em;
  color: var(--ink);
}
h1 { font-size: 30px; line-height: 1.1; font-variation-settings: "opsz" 72; }
h2 { font-size: 21px; line-height: 1.2; margin-bottom: 14px; }
h3 { font-size: 16px; line-height: 1.3; font-weight: 600; font-family: 'IBM Plex Sans', sans-serif; letter-spacing: 0; }
p { color: var(--ink-soft); }
code { font-family: 'IBM Plex Mono', monospace; font-size: 0.9em; background: var(--paper); padding: 1px 5px; border-radius: 3px; }
.container {
  max-width: 920px;
  margin: 0 auto;
  background: white;
  border-radius: 14px;
  box-shadow: var(--shadow);
  border: 1px solid var(--line-light);
  padding: 32px 28px;
}
.header-bar {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  padding-bottom: 20px;
  margin-bottom: 24px;
  border-bottom: 1px solid var(--line-light);
  gap: 16px;
  flex-wrap: wrap;
}
.header-bar .subtitle {
  font-size: 13px;
  color: var(--ink-muted);
  margin-top: 4px;
  letter-spacing: 0.02em;
  text-transform: uppercase;
}
.user-chip {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 6px 12px;
  background: var(--paper);
  border-radius: 999px;
  font-size: 13px;
  color: var(--ink-soft);
}
.user-chip .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); }

/* Forms */
.form-group { margin-bottom: 16px; }
label {
  display: block;
  font-size: 13px;
  font-weight: 500;
  color: var(--ink-soft);
  margin-bottom: 6px;
  letter-spacing: 0.01em;
}
input[type="text"], input[type="password"], input[type="date"], input[type="number"], select, textarea {
  width: 100%;
  padding: 11px 14px;
  border: 1px solid var(--line);
  border-radius: 8px;
  font-size: 15px;
  font-family: inherit;
  background: white;
  color: var(--ink);
  transition: border-color 0.15s, box-shadow 0.15s;
}
textarea { resize: vertical; min-height: 60px; line-height: 1.5; }
input:focus, select:focus, textarea:focus {
  outline: none;
  border-color: var(--teal);
  box-shadow: 0 0 0 3px rgba(31, 79, 74, 0.1);
}

/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  background: var(--teal);
  color: white;
  border: none;
  padding: 11px 20px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 500;
  font-family: inherit;
  transition: background 0.15s, transform 0.05s;
}
.btn:hover { background: var(--teal-dark); }
.btn:active { transform: translateY(1px); }
.btn-secondary { background: white; color: var(--ink); border: 1px solid var(--line); }
.btn-secondary:hover { background: var(--paper); }
.btn-danger { background: var(--coral); }
.btn-danger:hover { background: #a73a3d; }
.btn-ghost { background: transparent; color: var(--ink-soft); padding: 8px 12px; }
.btn-ghost:hover { background: var(--paper); }
.btn-sm { padding: 7px 12px; font-size: 13px; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }

/* Alerts */
.alert {
  padding: 12px 16px;
  border-radius: 8px;
  margin-bottom: 16px;
  font-size: 14px;
  border-left: 3px solid;
}
.alert-info { background: var(--paper); border-color: var(--teal); color: var(--ink-soft); }
.alert-warning { background: #FBF1E3; border-color: var(--amber); color: #6B4517; }
.alert-success { background: #EDF1E8; border-color: var(--green); color: #2F4226; }
.alert-danger { background: var(--coral-light); border-color: var(--coral); color: #6B2024; }

/* Tabs */
.tab-bar {
  display: flex;
  gap: 4px;
  border-bottom: 1px solid var(--line-light);
  margin-bottom: 24px;
  overflow-x: auto;
}
.tab {
  padding: 10px 16px;
  cursor: pointer;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  color: var(--ink-soft);
  font-weight: 500;
  font-size: 14px;
  white-space: nowrap;
  background: none;
  border-top: none;
  border-left: none;
  border-right: none;
  font-family: inherit;
}
.tab.active { border-bottom-color: var(--teal); color: var(--ink); }
.tab:hover { color: var(--ink); }
.tab.cat-nobet.active { border-bottom-color: var(--coral); }
.tab.cat-izin.active { border-bottom-color: var(--purple); }
.tab.cat-kongre.active { border-bottom-color: var(--yellow); }
.tab.cat-rotasyon.active { border-bottom-color: var(--indigo); }
.tab.cat-ders.active { border-bottom-color: var(--blue); }
.tab.cat-rapor.active { border-bottom-color: var(--red); }
.tab.cat-ozelnobet.active { border-bottom-color: var(--green); }

/* Month navigator */
.month-nav {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  margin: 16px 0;
  padding: 14px;
  background: var(--paper);
  border-radius: 10px;
}
.month-nav select {
  width: auto;
  padding: 8px 12px;
  font-size: 14px;
  font-weight: 600;
}
.month-nav button {
  background: white;
  border: 1px solid var(--line);
  padding: 6px 12px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 16px;
  color: var(--ink);
  font-family: inherit;
}
.month-nav button:hover { background: var(--cream); }

/* Calendar */
.calendar-wrap {
  background: var(--paper);
  border-radius: 12px;
  padding: 18px 14px;
  margin: 14px 0;
}
.calendar-info {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 13px;
  color: var(--ink-soft);
  margin-bottom: 12px;
  flex-wrap: wrap;
  gap: 8px;
}
.calendar-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 5px;
}
.day-header {
  text-align: center;
  font-size: 11px;
  color: var(--ink-muted);
  padding: 4px 0;
  font-weight: 700;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}
.day-cell {
  aspect-ratio: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  background: white;
  border: 1px solid var(--line-light);
  border-radius: 7px;
  cursor: pointer;
  font-weight: 500;
  font-size: 14px;
  color: var(--ink);
  user-select: none;
  transition: all 0.12s;
  font-variant-numeric: tabular-nums;
  position: relative;
}
.day-cell:hover { transform: translateY(-1px); }
.day-cell.empty {
  background: transparent;
  border: none;
  cursor: default;
}
.day-cell.empty:hover { transform: none; }
.day-cell.weekend { color: var(--ink-muted); }
.day-cell.locked { cursor: not-allowed; opacity: 0.75; }
.day-cell.locked:hover { transform: none; }

/* Category colors */
.day-cell.cat-nobet { background: var(--coral); color: white; border-color: var(--coral); }
.day-cell.cat-izin { background: var(--purple); color: white; border-color: var(--purple); }
.day-cell.cat-kongre { background: var(--yellow); color: var(--ink); border-color: var(--yellow); }
.day-cell.cat-rotasyon { background: var(--indigo); color: white; border-color: var(--indigo); }
.day-cell.cat-ders { background: var(--blue); color: white; border-color: var(--blue); }
.day-cell.cat-rapor { background: var(--red); color: white; border-color: var(--red); }
.day-cell.cat-ozelnobet { background: var(--green); color: white; border-color: var(--green); }

.day-cell:hover:not(.locked):not(.empty) {
  filter: brightness(0.95);
}

/* Multi-category indicator dots */
.day-cell .indicators {
  position: absolute;
  bottom: 3px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 2px;
}
.day-cell .indicators .dot {
  width: 4px; height: 4px; border-radius: 50%;
  background: rgba(255, 255, 255, 0.7);
}

/* Legend */
.legend {
  display: flex;
  gap: 14px;
  font-size: 12px;
  color: var(--ink-muted);
  margin-top: 10px;
  flex-wrap: wrap;
}
.legend-item { display: flex; align-items: center; gap: 6px; }
.legend-swatch { width: 14px; height: 14px; border-radius: 4px; }
.legend-swatch.cat-nobet { background: var(--coral); }
.legend-swatch.cat-izin { background: var(--purple); }
.legend-swatch.cat-kongre { background: var(--yellow); }
.legend-swatch.cat-rotasyon { background: var(--indigo); }
.legend-swatch.cat-ders { background: var(--blue); }
.legend-swatch.cat-rapor { background: var(--red); }
.legend-swatch.cat-ozelnobet { background: var(--green); }

/* Range input */
.range-row {
  display: flex;
  gap: 10px;
  align-items: flex-end;
  flex-wrap: wrap;
  margin-top: 14px;
  padding: 14px;
  background: var(--paper);
  border-radius: 10px;
}
.range-row .range-inputs { display: flex; gap: 8px; align-items: flex-end; flex: 1; min-width: 200px; flex-wrap: wrap; }
.range-row label { margin-bottom: 4px; font-size: 12px; }
.range-row input { padding: 8px 10px; font-size: 14px; }

/* Kongre details section */
.kongre-section {
  margin-top: 16px;
  padding: 14px;
  background: var(--yellow-light);
  border-radius: 10px;
  border-left: 3px solid var(--yellow);
}
.kongre-section h3 { margin-bottom: 8px; font-size: 14px; }


.detail-section {
  margin-top: 16px;
  padding: 14px;
  background: var(--paper);
  border-radius: 10px;
  border-left: 3px solid var(--teal);
}
.detail-section.kongre-detail { background: var(--yellow-light); border-left-color: var(--yellow); }
.detail-section.ders-detail { background: var(--blue-light); border-left-color: var(--blue); }
.detail-section.rapor-detail { background: var(--red-light); border-left-color: var(--red); }
.detail-section.ozelnobet-detail { background: #E7F0E4; border-left-color: var(--green); }
.detail-section.rotasyon-detail { background: var(--indigo-light); border-left-color: var(--indigo); }
.detail-section h3 { margin-bottom: 8px; font-size: 14px; }
.detail-row {
  display: grid;
  grid-template-columns: minmax(170px, 0.8fr) minmax(200px, 1.2fr);
  gap: 10px;
  align-items: center;
  padding: 10px 0;
  border-top: 1px solid rgba(26, 22, 18, 0.08);
}
.detail-row.detail-row-rotasyon {
  grid-template-columns: minmax(170px, 0.8fr) minmax(190px, 1.1fr) minmax(130px, 0.7fr);
}
.detail-row:first-of-type { border-top: none; }
.detail-date-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: white;
  border: 1px solid var(--line-light);
  border-radius: 8px;
  padding: 8px 10px;
  font-size: 13px;
  color: var(--ink-soft);
  font-weight: 600;
}
.detail-name-input, .detail-type-select { padding: 9px 12px !important; font-size: 14px !important; }
.detail-type-select { min-width: 130px; }
.report-stats, .status-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 10px;
  margin-top: 12px;
}
.stat-card {
  background: white;
  border: 1px solid var(--line-light);
  border-radius: 10px;
  padding: 12px;
}
.stat-card .stat-num {
  font-family: 'Fraunces', Georgia, serif;
  font-size: 24px;
  line-height: 1;
  color: var(--ink);
}
.stat-card .stat-label {
  font-size: 12px;
  color: var(--ink-muted);
  margin-top: 4px;
}
.status-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
  margin-top: 12px;
}
.status-table th, .status-table td {
  border-bottom: 1px solid var(--line-light);
  padding: 9px 8px;
  text-align: left;
  vertical-align: top;
}
.status-table th {
  color: var(--ink-muted);
  text-transform: uppercase;
  letter-spacing: 0.04em;
  font-size: 11px;
  font-weight: 700;
}
.status-pill {
  display: inline-flex;
  padding: 2px 7px;
  border-radius: 999px;
  background: var(--paper);
  margin: 1px 2px 1px 0;
  font-variant-numeric: tabular-nums;
}
.status-metrics .status-pill {
  display: flex;
  width: max-content;
  max-width: 100%;
  margin: 2px 0 4px 0;
  white-space: nowrap;
}
.status-note {
  display: block;
  margin-top: 5px;
  color: var(--ink-muted);
  font-size: 11px;
  line-height: 1.35;
}

/* Resident table */
.resident-list {
  background: white;
  border: 1px solid var(--line-light);
  border-radius: 10px;
  overflow: hidden;
}
.resident-row {
  display: flex;
  align-items: center;
  padding: 14px 16px;
  gap: 14px;
  border-bottom: 1px solid var(--line-light);
}
.resident-row:last-child { border-bottom: none; }
.resident-row .name { font-weight: 600; min-width: 70px; font-variant-caps: small-caps; letter-spacing: 0.05em; }
.resident-row .meta { color: var(--ink-muted); font-size: 13px; flex: 1; }
.checkbox-wrap {
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  font-size: 13px;
  color: var(--ink-soft);
}
.checkbox-wrap input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; accent-color: var(--green); }

/* Slot list (admin editable) */
.slot-list-header {
  display: grid;
  grid-template-columns: 28px 1fr 110px 80px 36px;
  gap: 10px;
  padding: 8px 14px;
  font-size: 12px;
  color: var(--ink-muted);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  font-weight: 600;
}
.slot-list {
  background: white;
  border: 1px solid var(--line-light);
  border-radius: 10px;
  overflow: hidden;
}
.slot-row {
  display: grid;
  grid-template-columns: 28px 1fr 110px 80px 36px;
  gap: 10px;
  align-items: center;
  padding: 8px 14px;
  border-bottom: 1px solid var(--line-light);
}
.slot-row:last-child { border-bottom: none; }
.slot-row:hover { background: #FCFAF5; }
.slot-num {
  font-size: 12px;
  color: var(--ink-muted);
  text-align: right;
  font-variant-numeric: tabular-nums;
}
.slot-name, .slot-pass {
  padding: 7px 10px;
  font-size: 14px;
  border: 1px solid transparent;
  background: transparent;
  border-radius: 6px;
  font-family: inherit;
  color: var(--ink);
}
.slot-name:hover, .slot-pass:hover { border-color: var(--line); background: white; }
.slot-name:focus, .slot-pass:focus {
  outline: none;
  border-color: var(--teal);
  background: white;
  box-shadow: 0 0 0 2px rgba(31, 79, 74, 0.1);
}
.slot-name { font-weight: 600; }
.slot-pass { font-family: monospace; }
.slot-meta { font-size: 12px; color: var(--ink-muted); }
.clear-slot-btn {
  padding: 4px 8px !important;
  font-size: 14px !important;
  color: var(--ink-muted);
}
.clear-slot-btn:hover { color: var(--coral); background: var(--coral-light); }

/* Summary */
.summary-box {
  background: var(--paper);
  border: 1px solid var(--line-light);
  border-radius: 10px;
  padding: 20px;
  font-size: 13.5px;
  line-height: 1.7;
  margin-top: 12px;
  font-variant-numeric: tabular-nums;
}
.summary-resident { margin-bottom: 14px; padding-bottom: 12px; border-bottom: 1px dashed var(--line); }
.summary-resident:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
.summary-resident .res-name {
  font-weight: 700;
  color: var(--ink);
  font-variant-caps: small-caps;
  letter-spacing: 0.06em;
  font-size: 15px;
  margin-bottom: 4px;
}
.summary-resident .res-line {
  margin-left: 12px;
  color: var(--ink-soft);
  font-size: 13px;
}
.summary-resident .res-label {
  font-weight: 600;
  color: var(--ink-muted);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  display: inline-block;
  min-width: 70px;
}
.summary-resident .empty-tok { color: var(--ink-muted); font-style: italic; }
.summary-resident .kongre-note {
  margin-left: 12px;
  color: var(--ink-soft);
  font-size: 12px;
  font-style: italic;
}

/* Month-section in summary */
.month-section { margin-bottom: 8px; }
.month-section .mname {
  font-weight: 600;
  color: var(--ink-muted);
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

/* Utility */
.muted { color: var(--ink-muted); font-size: 13px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row-between { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.mt-3 { margin-top: 20px; }
.mt-4 { margin-top: 28px; }
.mb-2 { margin-bottom: 12px; }
.divider { height: 1px; background: var(--line-light); margin: 24px 0; }
.cred-hint {
  background: var(--paper);
  border-radius: 8px;
  padding: 12px 14px;
  font-size: 12px;
  color: var(--ink-muted);
  margin-top: 16px;
  font-family: monospace;
  line-height: 1.7;
}
.cred-hint b { color: var(--ink-soft); }
.cred-hint .role { display: block; margin-top: 4px; }

/* Spinner */
.spinner {
  display: inline-block;
  width: 14px;
  height: 14px;
  border: 2px solid var(--line);
  border-top-color: var(--teal);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  vertical-align: middle;
  margin-right: 8px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.sync-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  background: #EDF1E8;
  border-radius: 999px;
  font-size: 11px;
  color: #4A6B3F;
  font-weight: 500;
  letter-spacing: 0.02em;
}
.sync-chip::before {
  content: '';
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--green);
  animation: pulse 2s infinite;
}
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }


/* Maintenance */
.maintenance-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
  gap: 12px;
  margin: 14px 0;
}
.maintenance-card {
  background: linear-gradient(135deg, rgba(14, 22, 36, 0.96), rgba(24, 18, 40, 0.94));
  border: 1px solid rgba(83, 229, 255, 0.18);
  border-radius: 12px;
  padding: 14px;
  box-shadow: 0 0 18px rgba(83, 229, 255, 0.08);
}
.maintenance-num {
  font-size: 22px;
  font-weight: 800;
  color: var(--neon-cyan);

  const sorted = days.slice().sort((a, b) => a - b);
  const ranges = [];
  let start = sorted[0], end = sorted[0];
  for (let i = 1; i < sorted.length; i++) {

function nobetDeadlineInfo() {
  const d = state.data.nobetDeadline;
  if (!d || !d.enabled || !d.startedAt) {
    return { enabled: false, expired: false, daysLeft: null, endsAt: null };
  }
  const start = new Date(d.startedAt);
  const end = new Date(start.getTime() + d.days * 24 * 60 * 60 * 1000);
  const now = new Date();
  const msLeft = end - now;
  const daysLeft = Math.ceil(msLeft / (24 * 60 * 60 * 1000));

function getSeniorityInfo(startIso, refDate = new Date()) {
  const start = parseIsoDateLocal(startIso);
  if (!start) {
    return { hasDate: false, future: false, label: 'Başlama tarihi girilmedi', elapsed: '—', yearNo: '—', monthNo: '—', totalMonths: null };
  }
  const ref = new Date(refDate.getFullYear(), refDate.getMonth(), refDate.getDate());
  if (start > ref) {
    return { hasDate: true, future: true, label: 'Başlama tarihi gelecekte', elapsed: '—', yearNo: '—', monthNo: '—', totalMonths: null };
  }
  let totalMonths = (ref.getFullYear() - start.getFullYear()) * 12 + (ref.getMonth() - start.getMonth());
  if (ref.getDate() < start.getDate()) totalMonths -= 1;
  if (totalMonths < 0) totalMonths = 0;
  const elapsedYears = Math.floor(totalMonths / 12);
  const elapsedMonths = totalMonths % 12;
  const elapsedParts = [];
  if (elapsedYears) elapsedParts.push(`${elapsedYears} yıl`);

  if (!elapsedParts.length) elapsedParts.push('1 aydan az');

    hasDate: true,
    future: false,
    label: `${Math.floor(totalMonths / 12) + 1}. asistanlık senesi · ${totalMonths + 1}. ay`,
    elapsed: elapsedParts.join(' '),
    yearNo: `${Math.floor(totalMonths / 12) + 1}. sene`,
    monthNo: `${totalMonths + 1}. ay`,
    totalMonths
  };
}

function renderNobetDeadlineBanner() {
  const di = nobetDeadlineInfo();
  if (!di.enabled) {
    return `<div class="alert alert-info" style="font-size:13px;">⏱ Bu sekme için süre sınırı yok.</div>`;
  }
  if (di.expired) {
    return `<div class="alert alert-danger"><b>⏱ Süre doldu.</b> Nöbet istenmeyen günler için veri girişi kapalı. Yöneticinin yeni dönem açması gerekiyor.</div>`;
  }
  return `<div class="alert alert-warning"><b>⏱ Süre tanımlı:</b> ${di.daysLeft} gün kaldı (bitiş: ${fmtDateTimeTR(di.endsAt)})</div>`;
}

function renderLegend(activeCat) {
  if (activeCat === 'nobet') {
    return `<div class="legend"><div class="legend-item"><span class="legend-swatch cat-nobet"></span>Kişisel nöbet istememe</div><div class="legend-item"><span class="legend-swatch cat-nobet-auto"></span>İzin/kongre/dış rotasyon nedeniyle nöbet dışı</div></div>`;
  }
  if (activeCat === 'izin') {
    return `<div class="legend"><div class="legend-item"><span class="legend-swatch cat-izin"></span>İzin günü</div></div>`;
  }
  if (activeCat === 'kongre') {
    return `<div class="legend"><div class="legend-item"><span class="legend-swatch cat-kongre"></span>Kongre günü</div></div>`;
  }
  if (activeCat === 'rotasyon') {
    return `<div class="legend"><div class="legend-item"><span class="legend-swatch cat-rotasyon"></span>Rotasyon günü</div><div class="legend-item"><span style="opacity:.7">İç/Dış</span> Bilgi kutusundan seçilir</div></div>`;
  }
  if (activeCat === 'ders') {
    return `<div class="legend"><div class="legend-item"><span class="legend-swatch cat-ders"></span>Katılınan ders/eğitim</div></div>`;
  }
  if (activeCat === 'rapor') {
    return `<div class="legend"><div class="legend-item"><span class="legend-swatch cat-rapor"></span>Raporlu gün</div></div>`;
  }
  if (activeCat === 'ozelnobet') {
    return `<div class="legend"><div class="legend-item"><span class="legend-swatch cat-ozelnobet"></span>Özel nöbet istenen gün</div><div class="legend-item"><span style="opacity:.45">▧</span>Hafta içi kilitli ise önce 3 hafta sonu seçin</div></div>`;
  }
  return '';
}

function calendarCatForIso(r, iso, activeCat) {
  ensureResidentShape(r);
  if (activeCat === 'nobet') {
    if (isNobetMarker(r.dates[iso])) return 'nobet';
    // Nöbet istememe sekmesinde, izin/kongre/dış rotasyon nedeniyle zaten nöbet yazılmayacak günleri
    // soluk/işaretli göster. Bu günler kişisel nöbet istememe değildir; sadece yanlışlıkla boş sanılmasın.
    const autoNoDuty = r.izinDates[iso] || r.kongreDates[iso] || getExternalRotasyonIsoList(r).includes(iso);
    return autoNoDuty ? 'nobet-auto' : null;
  }
  const store = extraDateStore(r, activeCat);
  return store && store[iso] ? activeCat : null;
}

function renderCalendarCells(r, year, month, locked, activeCat = state.residentCat) {
  const days = daysInMonth(year, month);
  const first = firstDayMon0(year, month);
  const headers = DAYS_TR_SHORT.map(d => `<div class="day-header">${d}</div>`).join('');
  let cells = '';
  for (let i = 0; i < first; i++) cells += '<div class="day-cell empty"></div>';
  for (let d = 1; d <= days; d++) {
    const iso = ymd(year, month, d);
    const cat = calendarCatForIso(r, iso, activeCat);
    const cls = ['day-cell'];
    if (cat === 'nobet-auto') cls.push('cat-nobet-auto');
    else if (cat && CATEGORIES[cat]) cls.push(CATEGORIES[cat].color);
    const specialWeekdayLocked = activeCat === 'ozelnobet' && !locked && !cat && !isWeekend(year, month, d) && specialWeekendCountInMonth(r, year, month) < 3;
    if (locked) cls.push('locked');
    if (specialWeekdayLocked) cls.push('soft-locked');
    if (isWeekend(year, month, d) && !cat) cls.push('weekend');
    let title = '';
    if (specialWeekdayLocked) title = 'Hafta içi özel nöbet için önce bu ay en az 3 hafta sonu seçin';
    else if (cat === 'nobet-auto') title = 'Bu gün izin/kongre/dış rotasyon nedeniyle zaten nöbet dışı görünüyor; kişisel nöbet istememe seçimi değil.';
    else if (cat && CATEGORIES[cat]) title = CATEGORIES[cat].label;
    cells += `<div class="${cls.join(' ')}" data-iso="${iso}" title="${title}">${d}</div>`;
  }
  return headers + cells;
}

function renderCategoryDetailSection(r, cat, locked) {
  ensureResidentShape(r);
  if (cat === 'kongre') return renderNamedRangeSection(r, 'kongre', '📍 Kongre bilgileri', 'Kongre adı', 'Kongre seçtiğiniz her ayrı tarih aralığı için otomatik bir slot açılır. İki ayrı aralık seçerseniz iki kongre slotu görünür.', locked);
  if (cat === 'rotasyon') return renderRotasyonRangeSection(r, locked);
  if (cat === 'ders') return renderNamedRangeSection(r, 'ders', '📚 Katılınan ders/eğitim bilgileri', 'Ders / eğitim adı', 'Ders veya eğitim için seçtiğiniz her ayrı gün ya da tarih aralığı aşağıda ayrı slot olarak görünür.', locked);
  if (cat === 'rapor') return renderRaporSection(r, locked);
  if (cat === 'ozelnobet') return renderOzelNobetSection(r, locked);
  if (cat === 'nobet') return renderNobetInfoSection(r);
  return '';
}
function renderNobetInfoSection(r) {
  const personal = getCategoryIsoList(r, 'nobet');
  const auto = uniqueIsoList([getCategoryIsoList(r, 'izin'), getCategoryIsoList(r, 'kongre'), getExternalRotasyonIsoList(r)]);
  const personalThisMonth = personal.filter(iso => iso.startsWith(ym(state.navYear, state.navMonth)));
  const autoThisMonth = auto.filter(iso => iso.startsWith(ym(state.navYear, state.navMonth)));
  const fmt = (arr) => arr.length ? formatDatesByMonth(arr) : '<span class="empty-tok">— yok —</span>';
  return `
    <div class="detail-section kongre-detail">
      <h3>🧭 Bu ay nöbet dışı görünen kayıt özeti</h3>
      <p class="muted mb-2" style="font-size:12px;">Koyu kırmızı günler kişisel nöbet istememe; soluk kırmızı günler izin/kongre/dış rotasyon nedeniyle zaten nöbet yazılmayacak günlerdir.</p>
      <div class="res-line"><span class="res-label">Kişisel</span> ${fmt(personalThisMonth)}</div>
      <div class="res-line"><span class="res-label">Otomatik</span> ${fmt(autoThisMonth)}</div>
    </div>
  `;
}

function renderNamedRangeSection(r, cat, title, placeholder, helpText, locked) {
  const isoList = getCategoryIsoList(r, cat);
  const ranges = buildDateRanges(isoList);
  const cssClass = cat === 'kongre' ? 'kongre-detail' : 'ders-detail';
  const rows = ranges.map((range, idx) => {
    const key = rangeKey(range);
    const val = getDetailText(r, cat, range, ranges);
    const label = cat === 'kongre' ? `${idx + 1}. Kongre` : `${idx + 1}. Ders/Eğitim`;
    return `
      <div class="detail-row">
        <div class="detail-date-badge">${label}: ${formatRangeFull(range)}</div>
        <input type="text" class="detail-name-input" data-detail-cat="${cat}" data-detail-key="${escapeAttr(key)}" value="${escapeAttr(val)}" ${locked ? 'readonly' : ''} placeholder="${placeholder}">
      </div>
    `;
  }).join('');
  return `
    <div class="detail-section ${cssClass}">
      <h3>${title}</h3>
      <p class="muted mb-2" style="font-size:12px;">${helpText}</p>
      ${rows || `<p class="muted" style="font-size:12px;">Henüz tarih seçilmedi. Takvimden gün işaretleyince slotlar burada otomatik oluşur.</p>`}
    </div>

}

  const isoList = getCategoryIsoList(r, 'rotasyon');

    const key = rangeKey(range);
    const detail = getRotasyonDetail(r, range);

      <div class="detail-row detail-row-rotasyon">
        <div class="detail-date-badge">${idx + 1}. Rotasyon: ${formatRangeFull(range)}</div>
        <input type="text" class="detail-name-input" data-detail-cat="rotasyon" data-detail-key="${escapeAttr(key)}" data-detail-field="name" value="${escapeAttr(detail.name)}" ${locked ? 'readonly' : ''} placeholder="Rotasyon adı / birim">
        <select class="detail-type-select" data-detail-cat="rotasyon" data-detail-key="${escapeAttr(key)}" data-detail-field="type" ${locked ? 'disabled' : ''}>
          <option value="" ${detail.type === '' ? 'selected' : ''}>İç / dış?</option>
          <option value="İç" ${detail.type === 'İç' ? 'selected' : ''}>İç rotasyon</option>

      ${rows || `<p class="muted" style="font-size:12px;">Henüz rotasyon tarihi seçilmedi. Takvimden gün işaretleyince slotlar burada otomatik oluşur.</p>`}
    </div>
  `;
}

function renderOzelNobetSection(r, locked) {
  ensureResidentShape(r);
  const isoList = getCategoryIsoList(r, 'ozelnobet');
  const monthWeekendCount = specialWeekendCountInMonth(r, state.navYear, state.navMonth);
  const monthWeekdayCount = specialWeekdayCountInMonth(r, state.navYear, state.navMonth);
  const weekdayOpen = monthWeekendCount >= 3;
  const weekendList = isoList.filter(isWeekendIso);
  const weekdayList = isoList.filter(iso => !isWeekendIso(iso));
  const weekendRanges = buildDateRanges(weekendList);
  const weekdayRanges = buildDateRanges(weekdayList);
  return `
    <div class="detail-section ozelnobet-detail">
      <h3>⭐ Özel nöbet istekleri</h3>
      <p class="muted mb-2" style="font-size:12px;">Önce özellikle nöbet tutmak istediğiniz hafta sonu günlerini seçin. Aynı ay içinde en az 3 hafta sonu günü seçerseniz, o ay için hafta içi özel nöbet günü seçimi açılır.</p>
      <div class="report-stats">
        <div class="stat-card"><div class="stat-num">${monthWeekendCount}</div><div class="stat-label">Bu ay seçilen hafta sonu özel nöbeti</div></div>
        <div class="stat-card"><div class="stat-num">${monthWeekdayCount}</div><div class="stat-label">Bu ay seçilen hafta içi özel nöbeti</div></div>
        <div class="stat-card"><div class="stat-num">${weekdayOpen ? 'Açık' : `${monthWeekendCount}/3`}</div><div class="stat-label">Hafta içi özel seçim durumu</div></div>
      </div>
      ${weekdayOpen
        ? `<div class="alert alert-success mt-3" style="font-size:12px;">Bu ay 3 veya daha fazla hafta sonu seçildiği için hafta içi özel nöbet seçimi açık.</div>`
        : `<div class="alert alert-warning mt-3" style="font-size:12px;">Hafta içi gün seçmek için bu ay en az 3 hafta sonu özel nöbet günü seçilmelidir.</div>`}
      <div class="row mt-3">
        <button class="btn btn-secondary btn-sm" id="resetSpecialNobetMonth" ${locked ? 'disabled' : ''}>Bu ayın özel nöbet isteklerini sıfırla</button>

      <p class="muted mt-3" style="font-size:12px;"><b>Hafta sonu özel nöbet istekleri:</b> ${weekendRanges.length ? weekendRanges.map(formatRangeFull).join(' / ') : '— yok —'}</p>

    </div>
  `;

function renderRaporSection(r, locked) {

/* ---------- ADMIN VIEW ---------- */
function renderAdmin() {
  let roleLabel = '';
  if (isAdminFull()) roleLabel = 'Genel Yönetici (tam yetki)';
  else if (isAdminView()) roleLabel = 'Yönetici (görüntüleme)';
  else if (isAdminRot()) roleLabel = 'Rotasyon görüntüleyici';
  else if (isAdminNobet()) roleLabel = 'Nöbet görüntüleyici';

  // Available tabs by role
  const tabs = [];
  if (isAdminFull() || isAdminView()) {
    tabs.push({ id: 'summary',     label: 'Özet (tüm kategoriler)' });
    tabs.push({ id: 'status',      label: 'Durum bildirir' });
    tabs.push({ id: 'seniority',   label: 'Asistanlık senesi' });
    tabs.push({ id: 'submissions', label: 'Asistanlar' });
    tabs.push({ id: 'residents',   label: 'Asistan listesi' });
    if (isAdminFull()) {
      tabs.push({ id: 'admin-pass',  label: 'Şifreler' });
      tabs.push({ id: 'maintenance', label: 'Sistem bakımı' });
    }
  } else if (isAdminRot()) {
    tabs.push({ id: 'summary-rot', label: 'Rotasyon süreleri' });
  } else if (isAdminNobet()) {
    tabs.push({ id: 'summary-nobet', label: 'Nöbet istenmeyen günler' });
  }

  // Default to first available tab
  if (!tabs.some(t => t.id === state.adminTab)) {
    state.adminTab = tabs[0]?.id || 'summary';
  }

  const tabHtml = tabs.map(t =>
    `<button class="tab ${state.adminTab === t.id ? 'active' : ''}" data-admintab="${t.id}">${t.label}</button>`
  ).join('');

  let body = '';
  if (state.adminTab === 'summary')        body = renderAdminSummary();
  else if (state.adminTab === 'status')     body = renderAdminStatus();
  else if (state.adminTab === 'seniority')  body = renderAdminSeniority();
  else if (state.adminTab === 'summary-rot')   body = renderAdminRotSummary();
  else if (state.adminTab === 'summary-nobet') body = renderAdminNobetSummary();
  else if (state.adminTab === 'submissions')   body = renderAdminSubmissions();
  else if (state.adminTab === 'residents')     body = renderAdminResidents();
  else if (state.adminTab === 'admin-pass')    body = renderAdminPasswords();
  else if (state.adminTab === 'maintenance')   body = renderAdminMaintenance();

  return `
    <div class="header-bar">
      <div>
        <h1>Yönetici Paneli</h1>
        <div class="subtitle">${roleLabel}</div>
      </div>

function buildPlainAll(residents) {
  const lines = [];
  residents.forEach(r => {
    ensureResidentShape(r);
    lines.push(`${r.name}${r.submitted ? ' (onaylı)' : ''}:`);
    const nobetCombinedIso = getNoDutyIsoList(r);
    const kisiselIso = getCategoryIsoList(r, 'nobet');

    const izinIso    = getCategoryIsoList(r, 'izin');
    const rotIso     = getCategoryIsoList(r, 'rotasyon');
    const disRotIso  = getExternalRotasyonIsoList(r);
    const icRotIso   = getInternalRotasyonIsoList(r);
    const dersIso    = getCategoryIsoList(r, 'ders');
    const raporIso   = getCategoryIsoList(r, 'rapor');
    const ozelIso    = getCategoryIsoList(r, 'ozelnobet');
    lines.push(`  Nöbet yok (tümü): ${nobetCombinedIso.length ? plainByMonth(nobetCombinedIso) : '—'}`);
    lines.push(`    ↳ Kişisel istek: ${kisiselIso.length ? plainByMonth(kisiselIso) : '—'}`);
    lines.push(`    ↳ Kongre:        ${kongreIso.length ? plainByMonth(kongreIso) : '—'}`);
    lines.push(`    ↳ İzin:          ${izinIso.length ? plainByMonth(izinIso) : '—'}`);
    lines.push(`    ↳ Dış rotasyon:  ${disRotIso.length ? plainByMonth(disRotIso) : '—'}`);
    if (icRotIso.length) lines.push(`  İç rotasyon:      ${plainByMonth(icRotIso)}`);
    lines.push(`  Ders:             ${dersIso.length ? plainByMonth(dersIso) : '—'}`);
    lines.push(`  Rapor:            ${raporIso.length ? plainByMonth(raporIso) : '—'}`);
    lines.push(`  Özel nöbet:       ${ozelIso.length ? plainByMonth(ozelIso) : '—'}`);
    const kDetail = plainNamedDetails(r, 'kongre');
    const rotDetail = plainNamedDetails(r, 'rotasyon');
    const dDetail = plainNamedDetails(r, 'ders');
    if (kDetail) lines.push(`  Kongre adları: ${kDetail}`);
    if (rotDetail) lines.push(`  Rotasyon bilgileri: ${rotDetail}`);
    if (dDetail) lines.push(`  Ders adları:   ${dDetail}`);
    lines.push(`  Asistanlığa başlama: ${r.assistantStartDate || '—'}`);

  });

}

function plainByMonth(isoList) {
  const byMonth = {};
  isoList.forEach(iso => {
    const { year, month, day } = parseYmd(iso);
    const k = `${year}-${month}`;
    if (!byMonth[k]) byMonth[k] = { year, month, days: [] };
    byMonth[k].days.push(day);
  });
  const parts = Object.values(byMonth)
    .sort((a,b) => a.year !== b.year ? a.year - b.year : a.month - b.month)
    .map(g => {
      const sorted = g.days.slice().sort((a,b)=>a-b);
      return `${MONTHS_TR[g.month-1]} ${g.year}: ${sorted.join(', ')} [${formatRanges(sorted)}]`;
    });
  return parts.join(' / ');
}

function formatDatesByMonth(isoList) {
  const byMonth = {};
  isoList.forEach(iso => {
    const { year, month, day } = parseYmd(iso);
    const k = `${year}-${month}`;
    if (!byMonth[k]) byMonth[k] = { year, month, days: [] };
    byMonth[k].days.push(day);
  });
  return Object.values(byMonth)
    .sort((a,b) => a.year !== b.year ? a.year - b.year : a.month - b.month)
    .map(g => {
      const sorted = g.days.slice().sort((a,b)=>a-b);
      return `<div class="month-section"><span class="mname">${MONTHS_TR[g.month-1]} ${g.year}:</span> ${sorted.join(', ')} <span class="muted" style="font-size:12px;">(${formatRanges(sorted)})</span></div>`;
    }).join('');
}

function formatNamedDetails(r, cat) {
  const ranges = buildDateRanges(getCategoryIsoList(r, cat));
  return ranges.map((range, idx) => {
    if (cat === 'rotasyon') {
      const d = getRotasyonDetail(r, range);
      const parts = [];
      if (d.name) parts.push(escapeHtml(d.name));
      if (d.type) parts.push(escapeHtml(getRotasyonTypeLabel(d.type)));
      if (!parts.length) return '';
      return `${idx + 1}. rotasyon (${formatRangeFull(range)}): ${parts.join(' · ')}`;
    }
    const name = getDetailText(r, cat, range, ranges).trim();
    if (!name) return '';
    const prefix = cat === 'kongre' ? `${idx + 1}. kongre` : `${idx + 1}. ders`;
    return `${prefix} (${formatRangeFull(range)}): ${escapeHtml(name)}`;
  }).filter(Boolean).join(' / ');
}
function plainNamedDetails(r, cat) {
  const ranges = buildDateRanges(getCategoryIsoList(r, cat));
  return ranges.map((range, idx) => {
    if (cat === 'rotasyon') {
      const d = getRotasyonDetail(r, range);
      const parts = [];
      if (d.name) parts.push(d.name);
      if (d.type) parts.push(getRotasyonTypeLabel(d.type));
      if (!parts.length) return '';
      return `${idx + 1}. rotasyon (${formatRangeFull(range)}): ${parts.join(' · ')}`;
    }
    const name = getDetailText(r, cat, range, ranges).trim();
    if (!name) return '';
    const prefix = cat === 'kongre' ? `${idx + 1}. kongre` : `${idx + 1}. ders`;
    return `${prefix} (${formatRangeFull(range)}): ${name}`;
  }).filter(Boolean).join(' / ');
}

function statusCountNoun(cat) {
  return {
    izin: 'izin',
    kongre: 'kongre',
    rotasyon: 'rotasyon',
    ders: 'ders',
    rapor: 'rapor'
  }[cat] || 'kayıt';
}
function statusDateHint(isoList, year) {
  const yearList = isoList.filter(iso => parseYmd(iso).year === year);
  if (!yearList.length) return '';
  const ranges = buildDateRanges(yearList);
  const first = ranges.slice(0, 3).map(formatRangeFull).join(', ');
  const more = ranges.length > 3 ? ` +${ranges.length - 3} aralık` : '';
  return `${year} tarihleri: ${first}${more}`;
}

function renderAdminStatus() {
  const residents = state.data.residents.filter(r => r.name && r.name.trim());
  const now = new Date();
  const curYear = now.getFullYear();
  const curMonth = now.getMonth() + 1;
  const rows = residents.map(r => {
    ensureResidentShape(r);
    const cats = ['izin', 'kongre', 'rotasyon', 'ders', 'rapor'];
    const cells = cats.map(cat => {
      const list = getCategoryIsoList(r, cat);
      const noun = statusCountNoun(cat);
      const hint = statusDateHint(list, curYear);
      if (cat === 'rotasyon') {
        return `<td class="status-metrics"><span class="status-pill">Bu ay: ${rotasyonStatusText(r, list, curYear, curMonth, 'month')}</span><span class="status-pill">${curYear} ${noun}: ${rotasyonStatusText(r, list, curYear, curMonth, 'year')}</span><span class="status-pill">Toplam ${noun}: ${rotasyonStatusText(r, list, curYear, curMonth, 'total')}</span>${hint ? `<span class="status-note">${escapeHtml(hint)}</span>` : ''}</td>`;
      }
      const m = countDatesInMonth(list, curYear, curMonth);
      const y = countDatesInYear(list, curYear);
      const all = r.assistantStartDate ? countDatesSince(list, r.assistantStartDate) : list.length;
      return `<td class="status-metrics"><span class="status-pill">Bu ay: ${m}</span><span class="status-pill">${curYear} ${noun}: ${y}</span><span class="status-pill">Toplam ${noun}: ${all}</span>${hint ? `<span class="status-note">${escapeHtml(hint)}</span>` : ''}</td>`;
    }).join('');
    return `<tr><td><b>${escapeHtml(r.name)}</b><br><span class="muted">Başlama: ${r.assistantStartDate ? escapeHtml(formatIsoDateTR(r.assistantStartDate)) : '—'}</span></td>${cells}</tr>`;
  }).join('');
  return `
    <h2>Asistan durumu bildirir ekran</h2>
    <p class="muted mb-2"><b>Bu ay</b> = içinde bulunulan ay (${MONTHS_TR[curMonth - 1]} ${curYear}); <b>${curYear} izin/kongre/ders/rapor</b> = seçili takvim yılı içindeki gün sayısıdır; <b>rotasyon</b> ise rotasyon parsel sayısı ve parantez içinde toplam gün olarak gösterilir. Bu bilgi asistanlık senesi değildir. Asistanın kaçıncı senesinde/ayında olduğunu görmek için <b>Asistanlık senesi</b> sekmesini kullanın. <b>Toplam</b> = asistanlığa başlama tarihi varsa o tarihten itibaren, yoksa tüm kayıtlar.</p>
    <div class="summary-box status-table-wrap">
      <table class="status-table">
        <thead><tr><th>Asistan</th><th>İzin</th><th>Kongre</th><th>Rotasyon</th><th>Ders</th><th>Rapor</th></tr></thead>
        <tbody>${rows || '<tr><td colspan="6">— asistan yok —</td></tr>'}</tbody>
      </table>
    </div>
    <textarea id="plainStatus" style="position:absolute;left:-9999px;" readonly>${escapeHtml(buildPlainStatus(residents, curYear, curMonth))}</textarea>
    <div class="row mt-3"><button class="btn btn-sm" id="copyStatusBtn">📋 Durum özetini kopyala</button></div>
  `;
}
function buildPlainStatus(residents, year, month) {
  const lines = [`Durum bildirir ekran — ${MONTHS_TR[month - 1]} ${year}`];
  lines.push(`Not: "${year} içi" takvim yılı içindeki gün sayısıdır; asistanlık senesi değildir.`);
  residents.forEach(r => {
    ensureResidentShape(r);
    lines.push(`${r.name} (başlama: ${r.assistantStartDate || '—'}):`);
    ['izin','kongre','rotasyon','ders','rapor'].forEach(cat => {
      const list = getCategoryIsoList(r, cat);
      const noun = statusCountNoun(cat);
      if (cat === 'rotasyon') {
        lines.push(`  ${CATEGORIES[cat].label}: Bu ay ${rotasyonStatusText(r, list, year, month, 'month')}, ${year} ${noun} ${rotasyonStatusText(r, list, year, month, 'year')}, Toplam ${noun} ${rotasyonStatusText(r, list, year, month, 'total')}`);
        return;
      }
      const m = countDatesInMonth(list, year, month);
      const y = countDatesInYear(list, year);
      const all = r.assistantStartDate ? countDatesSince(list, r.assistantStartDate) : list.length;
      lines.push(`  ${CATEGORIES[cat].label}: Bu ay ${m}, ${year} ${noun} ${y}, Toplam ${noun} ${all}`);
    });
  });
  return lines.join('\n');
}

/* ---------- ADMIN: system maintenance ---------- */
function approxJsonBytes(obj) {
  const json = JSON.stringify(obj || {});
  return new Blob([json]).size;
}
function formatBytes(bytes) {
  if (!bytes && bytes !== 0) return '—';
  if (bytes < 1024) return `${bytes} B`;
  return `${(bytes / 1024).toFixed(1)} KB`;
}
function backupFilename(prefix) {
  const d = new Date();
  const stamp = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}_${String(d.getHours()).padStart(2,'0')}-${String(d.getMinutes()).padStart(2,'0')}`;
  return `${prefix}_${stamp}.json`;
}
function downloadJsonBackup(filename, obj) {
  const json = JSON.stringify(obj, null, 2);
  const blob = new Blob([json], { type: 'application/json;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => {
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }, 0);
}
function isIsoDateKey(key) {
  return /^\d{4}-\d{2}-\d{2}$/.test(String(key || ''));
}
function countTruthyDateKeys(obj) {
  if (!obj || typeof obj !== 'object' || Array.isArray(obj)) return 0;
  return Object.keys(obj).filter(k => isIsoDateKey(k) && !!obj[k]).length;
}
function analyzeMaintenanceData(data) {
  const residents = (data && Array.isArray(data.residents)) ? data.residents : [];
  const report = {
    bytes: approxJsonBytes(data || {}),
    residentCount: residents.length,
    filledResidentCount: residents.filter(r => r && r.name && String(r.name).trim()).length,
    legacyFieldCount: 0,
    oldMixedDatesCount: 0,
    falseOrInvalidDateKeys: 0,
    duplicateSameDayAcrossStores: 0,
    totalDateKeys: 0,
    cleanedEstimate: 0,
    largestResidents: []
  };
  const legacyNames = ['nobetDates', 'nobetIstemiyorumDates', 'nobetIstenmiyorDates', 'noDutyDates'];
  const storeNames = ['dates', 'izinDates', 'kongreDates', 'rotasyonDates', 'dersDates', 'raporDates', 'ozelNobetDates'];
  residents.forEach(r => {
    if (!r || typeof r !== 'object') return;
    const residentBytes = approxJsonBytes(r);
    let legacyForResident = 0;
    legacyNames.forEach(k => { if (r[k] && typeof r[k] === 'object') { legacyForResident += Object.keys(r[k]).length; report.legacyFieldCount += Object.keys(r[k]).length; } });
    const dates = (r.dates && typeof r.dates === 'object' && !Array.isArray(r.dates)) ? r.dates : {};
    Object.keys(dates).forEach(iso => {
      if (!isIsoDateKey(iso) || !dates[iso]) report.falseOrInvalidDateKeys++;
      if (dates[iso] === 'izin' || dates[iso] === 'kongre' || dates[iso] === 'rotasyon') report.oldMixedDatesCount++;
    });
    let allKeys = [];
    storeNames.forEach(storeName => {
      const store = r[storeName];
      if (!store || typeof store !== 'object' || Array.isArray(store)) return;
      Object.keys(store).forEach(iso => {
        if (!isIsoDateKey(iso) || !store[iso]) report.falseOrInvalidDateKeys++;
        else { allKeys.push(`${iso}`); report.totalDateKeys++; }
      });
    });
    const uniqueCount = new Set(allKeys).size;
    report.duplicateSameDayAcrossStores += Math.max(0, allKeys.length - uniqueCount);
    report.cleanedEstimate += legacyForResident + report.oldMixedDatesCount;
    report.largestResidents.push({ name: r.name || '(boş)', bytes: residentBytes, totalKeys: allKeys.length, uniqueKeys: uniqueCount });
  });
  report.largestResidents = report.largestResidents.sort((a,b) => b.bytes - a.bytes).slice(0, 8);
  return report;
}
function normalizeDateStoreObject(obj) {
  const out = {};
  if (!obj || typeof obj !== 'object' || Array.isArray(obj)) return out;
  Object.keys(obj).forEach(iso => {
    if (isIsoDateKey(iso) && obj[iso]) out[iso] = true;
  });
  return out;
}
function cleanDetailStore(obj, keepObject) {
  const out = {};
  if (!obj || typeof obj !== 'object' || Array.isArray(obj)) return out;
  Object.keys(obj).forEach(k => {
    const v = obj[k];
    if (typeof v === 'string') {
      const t = v.trim();
      if (t) out[k] = t;
    } else if (v && typeof v === 'object' && keepObject) {
      const name = typeof v.name === 'string' ? v.name.trim() : '';
      const type = typeof v.type === 'string' ? v.type : '';
      if (name || type) out[k] = { name, type };
    }
  });
  return out;
}
function safeCleanStateData(rawData) {
  const beforeBytes = approxJsonBytes(rawData || {});
  const data = cloneData(rawData || {});
  if (!Array.isArray(data.residents)) data.residents = buildDefaultResidents();
  if (!data.admin) data.admin = cloneData(DEFAULT_DATA.admin);
  if (!data.nobetDeadline) data.nobetDeadline = cloneData(DEFAULT_DATA.nobetDeadline);
  const legacyNames = ['nobetDates', 'nobetIstemiyorumDates', 'nobetIstenmiyorDates', 'noDutyDates'];
  let changed = false;
  let removedKeys = 0;
  data.residents.forEach(r => {
    if (!r || typeof r !== 'object') return;
    const before = JSON.stringify(r);
    ensureResidentShape(r);
    const cleanDates = {};
    if (r.dates && typeof r.dates === 'object' && !Array.isArray(r.dates)) {
      Object.keys(r.dates).forEach(iso => {
        if (isIsoDateKey(iso) && isNobetMarker(r.dates[iso])) cleanDates[iso] = 'nobet';
      });
    }
    r.dates = cleanDates;
    r.izinDates = normalizeDateStoreObject(r.izinDates);
    r.kongreDates = normalizeDateStoreObject(r.kongreDates);
    r.rotasyonDates = normalizeDateStoreObject(r.rotasyonDates);
    r.dersDates = normalizeDateStoreObject(r.dersDates);
    r.raporDates = normalizeDateStoreObject(r.raporDates);
    r.ozelNobetDates = normalizeDateStoreObject(r.ozelNobetDates);
    r.kongreler = cleanDetailStore(r.kongreler, false);
    r.dersler = cleanDetailStore(r.dersler, false);
    r.rotasyonlar = cleanDetailStore(r.rotasyonlar, true);
    legacyNames.forEach(k => { if (r[k]) { removedKeys += Object.keys(r[k]).length; delete r[k]; } });
    if (typeof r.assistantStartDate !== 'string') r.assistantStartDate = '';
    if (before !== JSON.stringify(r)) changed = true;
  });
  const afterBytes = approxJsonBytes(data);
  return { data, changed, beforeBytes, afterBytes, savedBytes: beforeBytes - afterBytes, removedKeys };
}

/* ============================================================
   EVENTS
   ============================================================ */
function bindEvents() {
  const loginBtn = document.getElementById('loginBtn');
  if (loginBtn) {
    loginBtn.addEventListener('click', handleLogin);
    document.getElementById('loginPass').addEventListener('keydown', e => {
      if (e.key === 'Enter') handleLogin();
    });
  }

  const logoutBtn = document.getElementById('logoutBtn');
  if (logoutBtn) logoutBtn.addEventListener('click', () => {
    state.currentUser = null;
    state.view = 'login';
    state.loginError = '';
    state.adminEditingResidentId = null;
    render();
  });

  const adminBackBtn = document.getElementById('adminBackBtn');
  if (adminBackBtn) adminBackBtn.addEventListener('click', () => {
    state.currentUser = 'admin-full';
    state.view = 'admin';
    state.adminTab = state.adminReturnTab || 'submissions';
    state.adminEditingResidentId = null;
    render();
  });

  // Resident category tabs
  document.querySelectorAll('.tab[data-cat]').forEach(t => {
    t.addEventListener('click', () => {
      state.residentCat = t.dataset.cat;
      render();
    });
  });

  // Month navigator
  const navMonth = document.getElementById('navMonth');
  if (navMonth) navMonth.addEventListener('change', () => {
    state.navMonth = parseInt(navMonth.value, 10);
    render();
  });
  const navYear = document.getElementById('navYear');
  if (navYear) navYear.addEventListener('change', () => {
    state.navYear = parseInt(navYear.value, 10);
    render();
  });
  const prevMonth = document.getElementById('prevMonth');
  if (prevMonth) prevMonth.addEventListener('click', () => {
    state.navMonth -= 1;
    if (state.navMonth < 1) { state.navMonth = 12; state.navYear -= 1; }
    if (state.navYear < YEAR_MIN) { state.navYear = YEAR_MIN; state.navMonth = 1; }
    render();
  });
  const nextMonth = document.getElementById('nextMonth');
  if (nextMonth) nextMonth.addEventListener('click', () => {
    state.navMonth += 1;
    if (state.navMonth > 12) { state.navMonth = 1; state.navYear += 1; }
    if (state.navYear > YEAR_MAX) { state.navYear = YEAR_MAX; state.navMonth = 12; }
    render();
  });

  // Day click — resident
  document.querySelectorAll('#calendar .day-cell[data-iso]').forEach(cell => {
    cell.addEventListener('click', () => {
      const r = state.currentUser;
      if (!canEditCurrentResident(r)) return;
      ensureResidentShape(r);
      if (state.residentCat === 'nobet') {
        const di = nobetDeadlineInfo();
        if (di.expired) {
          alert('Nöbet istenmeyen günler için süre dolmuştur. Yöneticiye başvurun.');
          return;
        }
      }
      toggleCategoryDate(r, state.residentCat, cell.dataset.iso);
      saveData();
      render();
    });
  });

  // Clear this month's category
  const clearMonthCat = document.getElementById('clearMonthCat');
  if (clearMonthCat) clearMonthCat.addEventListener('click', () => {
    const r = state.currentUser;
    if (!canEditCurrentResident(r)) return;
    const removed = clearMonthForCategory(r, state.residentCat, state.navYear, state.navMonth);
    saveData();
    state.flash = `${removed.length} gün temizlendi.`;
    render();
  });

  const resetSpecialNobetMonth = document.getElementById('resetSpecialNobetMonth');
  if (resetSpecialNobetMonth) resetSpecialNobetMonth.addEventListener('click', () => {
    const r = state.currentUser;
    if (!canEditCurrentResident(r)) return;
    const removed = clearSpecialMonth(r, state.navYear, state.navMonth);
    saveData();
    state.flash = `${removed.length} özel nöbet isteği sıfırlandı.`;
    render();
  });

  // Kongre/Rotasyon/Ders detail inputs
  document.querySelectorAll('.detail-name-input').forEach(inp => {
    inp.addEventListener('change', () => {
      const r = state.currentUser;
      if (!canEditCurrentResident(r)) return;
      ensureResidentShape(r);
      const cat = inp.dataset.detailCat;
      const key = inp.dataset.detailKey;
      const store = detailStore(r, cat);
      if (!store) return;
      const v = inp.value.trim();
      if (cat === 'rotasyon') {
        setRotasyonDetailField(r, key, 'name', v);
      } else {
        if (v) store[key] = v;
        else delete store[key];
      }
      saveData();
    });
  });

  document.querySelectorAll('.detail-type-select').forEach(sel => {
    sel.addEventListener('change', () => {
      const r = state.currentUser;
      if (!canEditCurrentResident(r)) return;
      ensureResidentShape(r);
      const key = sel.dataset.detailKey;
      const v = sel.value;
      setRotasyonDetailField(r, key, 'type', v);
      saveData();
    });
  });

  const assistantStartDate = document.getElementById('assistantStartDate');
  if (assistantStartDate) assistantStartDate.addEventListener('change', () => {
    const r = state.currentUser;
    if (!canEditCurrentResident(r)) return;
    ensureResidentShape(r);
    r.assistantStartDate = assistantStartDate.value || '';
    saveData();
    render();
  });


  const saveOwnPasswordBtn = document.getElementById('saveOwnPasswordBtn');
  if (saveOwnPasswordBtn) saveOwnPasswordBtn.addEventListener('click', () => {
    const r = state.currentUser;
    if (typeof r !== 'object' || isAdminEditingResident()) return;
    const p1 = document.getElementById('ownNewPass').value.trim();
    const p2 = document.getElementById('ownNewPass2').value.trim();
    if (!p1 || !p2) { alert('Yeni şifre alanlarını doldurun.'); return; }
    if (p1.length < 4) { alert('Şifre en az 4 karakter olmalı.'); return; }
    if (p1 !== p2) { alert('Şifreler aynı değil.'); return; }
    r.password = p1;
    saveData();
    state.flash = 'Şifreniz güncellendi.';
    alert('Şifreniz güncellendi. Bir sonraki girişte yeni şifrenizi kullanın.');
    render();
  });

  // Submit
  const submitBtn = document.getElementById('submitBtn');
  if (submitBtn) submitBtn.addEventListener('click', () => {
    const r = state.currentUser;
    ensureResidentShape(r);
    const total = countAllSelections(r);
    if (total === 0) {
      if (!confirm('Hiç gün seçmediniz. Yine de "tercih yok" olarak kaydedilsin mi?')) return;
    } else {
      if (!confirm(`Toplam ${total} gün/kayıt seçtiniz. Kaydedilsin mi? Sonra değiştiremezsiniz.`)) return;
    }
    r.submitted = true;
    saveData();
    render();
  });

  // Admin tabs
  document.querySelectorAll('.tab[data-admintab]').forEach(t => {
    t.addEventListener('click', () => {
      state.adminTab = t.dataset.admintab;
      render();
    });
  });

  // Admin: clear all
  const clearAllBtn = document.getElementById('clearAllBtn');
  if (clearAllBtn) clearAllBtn.addEventListener('click', () => {
    if (!canEdit()) return;
    if (!confirm('TÜM tercihler ve onaylar silinecek. Asistan listesi ve şifreler korunur. Devam edilsin mi?')) return;
    state.data.residents.forEach(r => {
      ensureResidentShape(r);
      r.dates = {}; r.izinDates = {}; r.kongreDates = {}; r.rotasyonDates = {}; r.kongreler = {}; r.rotasyonlar = {}; r.dersDates = {}; r.dersler = {}; r.raporDates = {}; r.ozelNobetDates = {}; r.submitted = false;
    });
    saveData();
    state.flash = 'Veriler temizlendi.';
    render();
  });

  // Deadline controls
  const deadlineStartBtn = document.getElementById('deadlineStartBtn');
  if (deadlineStartBtn) deadlineStartBtn.addEventListener('click', () => {
    if (!canEdit()) return;
    const enabled = document.getElementById('deadlineEnable').checked;
    const days = parseInt(document.getElementById('deadlineDays').value, 10);
    if (!enabled) { alert('Önce "Süre tanı" kutucuğunu işaretleyin.'); return; }
    if (isNaN(days) || days < 1 || days > 365) { alert('Geçerli gün sayısı girin (1-365).'); return; }
    state.data.nobetDeadline = { enabled: true, days: days, startedAt: new Date().toISOString() };
    saveData();
    state.flash = `Süre başlatıldı: ${days} gün.`;
    render();
  });
  const deadlineStopBtn = document.getElementById('deadlineStopBtn');
  if (deadlineStopBtn) deadlineStopBtn.addEventListener('click', () => {
    if (!canEdit()) return;
    if (!confirm('Süre tanıma kapatılacak. Devam edilsin mi?')) return;
    state.data.nobetDeadline = { enabled: false, days: 5, startedAt: null };
    saveData();
    state.flash = 'Süre kapatıldı.';
    render();
  });
  const deadlineEnable = document.getElementById('deadlineEnable');
  if (deadlineEnable) deadlineEnable.addEventListener('change', () => {
    if (!canEdit()) return;
    state.data.nobetDeadline.enabled = deadlineEnable.checked;
    saveData();
    render();
  });

  // Admin: toggle submission
  document.querySelectorAll('.submit-toggle').forEach(cb => {
    cb.addEventListener('change', () => {
      if (!canEdit()) { cb.checked = !cb.checked; return; }
      const r = state.data.residents.find(x => x.id === cb.dataset.resid);
      if (r) { r.submitted = cb.checked; saveData(); }
    });
  });

  // Copy buttons
  ['copyAllBtn','copyRotBtn','copyNobetBtn','copyStatusBtn','copySeniorityBtn'].forEach(btnId => {
    const btn = document.getElementById(btnId);
    if (!btn) return;
    const taId = btnId === 'copyAllBtn' ? 'plainAll' : btnId === 'copyRotBtn' ? 'plainRot' : btnId === 'copyStatusBtn' ? 'plainStatus' : btnId === 'copySeniorityBtn' ? 'plainSeniority' : 'plainNobet';
    btn.addEventListener('click', () => {
      const ta = document.getElementById(taId);
      ta.select();
      try {
        document.execCommand('copy');
        const orig = btn.textContent;
        btn.textContent = '✓ Kopyalandı';
        setTimeout(() => { btn.textContent = orig; }, 1500);
      } catch (e) { alert('Kopyalanamadı.'); }
    });
  });

  // Maintenance buttons
  const backupJsonBtn = document.getElementById('backupJsonBtn');
  if (backupJsonBtn) backupJsonBtn.addEventListener('click', () => {
    if (!canEdit()) return;
    downloadJsonBackup(backupFilename('asistan_bilgi_sistemi_yedek'), state.data);
  });

  const cleanupLegacyBtn = document.getElementById('cleanupLegacyBtn');
  if (cleanupLegacyBtn) cleanupLegacyBtn.addEventListener('click', () => {
    if (!canEdit()) return;
    if (!confirm('Önce mevcut verinin JSON yedeği indirilecek, sonra eski/boş/ara sürüm alanları temizlenecek. Gerçek seçim tarihleri korunur. Devam edilsin mi?')) return;
    downloadJsonBackup(backupFilename('temizlik_oncesi_yedek'), state.data);
    const result = safeCleanStateData(state.data);
    if (!result.changed) {
      state.flash = 'Temizlenecek gereksiz alan bulunmadı.';
      render();
      return;
    }
    state.data = result.data;
    saveData();
    state.flash = `Güvenli temizlik yapıldı. Yaklaşık ${formatBytes(Math.max(0, result.savedBytes))} azaltıldı.`;
    render();
  });

  // Slot editing
  document.querySelectorAll('.slot-name').forEach(inp => {
    inp.addEventListener('change', () => {
      if (!canEdit()) return;
      const r = state.data.residents.find(x => x.id === inp.dataset.resid);
      if (!r) return;
      const newName = inp.value.trim();
      if (newName && state.data.residents.some(x => x.id !== r.id && x.name.trim().toLowerCase() === newName.toLowerCase())) {
        alert('Bu isim başka bir slotta zaten var.');
        inp.value = r.name;
        return;
      }
      r.name = newName;
      saveData();
    });
  });

  document.querySelectorAll('.slot-pass').forEach(inp => {
    inp.addEventListener('change', () => {
      if (!canEdit()) return;
      const r = state.data.residents.find(x => x.id === inp.dataset.resid);
      if (!r) return;
      r.password = inp.value.trim() || '1234';
      if (!inp.value.trim()) inp.value = '1234';
      saveData();
    });
  });

  document.querySelectorAll('.clear-slot-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      if (!canEdit()) return;
      const r = state.data.residents.find(x => x.id === btn.dataset.resid);
      if (!r) return;
      const label = r.name || '(boş slot)';
      if (!confirm(`${label} slotu boşaltılacak (isim, şifre, tarihler sıfırlanır). Devam?`)) return;
      r.name = '';
      r.password = '1234';
      r.submitted = false;
      r.dates = {};
      r.izinDates = {};
      r.kongreDates = {};
      r.rotasyonDates = {};
      r.kongreler = {};
      r.rotasyonlar = {};
      r.dersDates = {};
      r.dersler = {};
      r.raporDates = {};
      r.ozelNobetDates = {};
      r.assistantStartDate = '';
      saveData();
      state.flash = 'Slot boşaltıldı.';
      render();
    });
  });

  const addSlotsBtn = document.getElementById('addSlotsBtn');
  if (addSlotsBtn) addSlotsBtn.addEventListener('click', () => {
    if (!canEdit()) return;
    for (let i = 0; i < 5; i++) state.data.residents.push(makeBlankResident(newId(), ''));
    saveData();
    state.flash = '5 boş slot eklendi.';
    render();
  });


  document.querySelectorAll('.edit-resident-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      if (!canEdit()) return;
      const r = state.data.residents.find(x => x.id === btn.dataset.resid);
      if (!r) return;
      ensureResidentShape(r);
      state.adminReturnTab = state.adminTab;
      state.adminEditingResidentId = r.id;
      state.currentUser = r;
      state.residentCat = 'nobet';
      state.view = 'resident';
      render();
    });
  });

  // Save admin passwords
  const saveAdminPassBtn = document.getElementById('saveAdminPassBtn');
  if (saveAdminPassBtn) saveAdminPassBtn.addEventListener('click', () => {
    if (!canEdit()) return;
    const f = document.getElementById('ap-full').value.trim();
    const v = document.getElementById('ap-view').value.trim();
    const r = document.getElementById('ap-rot').value.trim();
    const n = document.getElementById('ap-nobet').value.trim();
    if (!f || !v || !r || !n) { alert('Tüm şifreler dolu olmalı.'); return; }
    state.data.admin = { fullPassword: f, viewerPassword: v, rotViewerPassword: r, nobetViewerPassword: n };
    saveData();
    state.flash = 'Yönetici şifreleri güncellendi.';
    render();
  });
}

function handleLogin() {
  const userVal = document.getElementById('loginUser').value;
  const pass = document.getElementById('loginPass').value;
  if (!userVal) { state.loginError = 'Kullanıcı seçin.'; render(); return; }

  const adminMap = {
    '__admin_full__':  { check: state.data.admin.fullPassword,        role: 'admin-full' },
    '__admin_view__':  { check: state.data.admin.viewerPassword,      role: 'admin-view' },
    '__admin_rot__':   { check: state.data.admin.rotViewerPassword,   role: 'admin-rot' },
    '__admin_nobet__': { check: state.data.admin.nobetViewerPassword, role: 'admin-nobet' },
  };
  if (adminMap[userVal]) {
    if (pass === adminMap[userVal].check) {
      state.currentUser = adminMap[userVal].role;
      state.view = 'admin';
      // pick first sensible tab
      if (state.currentUser === 'admin-rot')   state.adminTab = 'summary-rot';
      else if (state.currentUser === 'admin-nobet') state.adminTab = 'summary-nobet';
      else state.adminTab = 'summary';
      state.loginError = '';
      state.adminEditingResidentId = null;
      render();
    } else {
      state.loginError = 'Şifre yanlış.';
      render();
    }
    return;
  }
  const r = state.data.residents.find(x => x.id === userVal);
  if (r && r.password === pass) {
    state.currentUser = r;
    state.view = 'resident';
    ensureResidentShape(r);
    state.residentCat = 'nobet';
    state.loginError = '';
    state.adminEditingResidentId = null;
    render();
  } else {
    state.loginError = 'Şifre yanlış.';
    render();
  }
}

/* ============================================================
   INIT
   ============================================================ */
async function start() {
  render();
  try {
    await signInAnonymously(fbAuth);

    let firstSnapshot = true;
    onSnapshot(DOC_REF, async (snap) => {
      if (snap.exists()) {
        const data = snap.data();
        if (!data.admin) data.admin = cloneData(DEFAULT_DATA.admin);
        if (!data.nobetDeadline) data.nobetDeadline = cloneData(DEFAULT_DATA.nobetDeadline);
        if (!data.residents) data.residents = buildDefaultResidents();
        // sanity: ensure each resident has old and new fields
        let normalizedChanged = false;
        data.residents.forEach(r => { if (ensureResidentShape(r)) normalizedChanged = true; });
        state.data = data;
        if (normalizedChanged) {
          try { await setDoc(DOC_REF, state.data); }
          catch (e) { console.error('Veri normalizasyonu kaydedilemedi:', e); }
        }
      } else if (firstSnapshot) {
        state.data = cloneData(DEFAULT_DATA);
        try {
          await setDoc(DOC_REF, state.data);
        } catch (e) {
          console.error('İlk veri yazımı başarısız:', e);
        }
      }
      state.fbStatus = 'ready';
      firstSnapshot = false;

      if (state.currentUser && typeof state.currentUser === 'object') {
        const fresh = state.data.residents.find(r => r.id === state.currentUser.id);
        if (fresh) state.currentUser = fresh;
        else { state.currentUser = null; state.view = 'login'; }
      }

      render();
    }, (err) => {
      console.error('Firestore okuma hatası:', err);
      state.fbStatus = 'error';
      state.fbError = err.message || String(err);
      render();
    });
  } catch (e) {
    console.error('Firebase başlatılamadı:', e);
    state.fbStatus = 'error';
    state.fbError = e.message || String(e);
    render();
  }
}

start();
</script>
